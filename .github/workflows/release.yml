name: AICountsManager release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install packaging compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.3 --no-progress -y
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AICountsManager-distribution
          path: |
            artifacts/releases/*/*-Setup.exe
            artifacts/releases/*/*-Portable.zip
            artifacts/releases/*/*-manifest.json
            artifacts/releases/*/*-self-test.json
            artifacts/releases/*/SHA256SUMS.txt
          if-no-files-found: error
